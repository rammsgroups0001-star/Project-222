<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RAMMS GROUPS // AI BIOMETRIC MOOD & BARITONE ANALYZER</title>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#070B12">

  <!-- Pinned Stable MediaPipe Face Mesh (Fast CDN for Custom Domains) -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/face_mesh.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --bg-dark: #070B12;
      --panel-bg: rgba(13, 19, 31, 0.92);
      --border-subtle: rgba(56, 189, 248, 0.28);
      --accent-cyan: #38BDF8;
      --accent-green: #10B981;
      --accent-amber: #F59E0B;
      --accent-red: #EF4444;
      --accent-purple: #A855F7;
      --text-primary: #F1F5F9;
      --text-secondary: #94A3B8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Consolas, "Courier New", monospace;
      user-select: none;
    }

    body, html {
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: var(--text-primary);
    }

    #appStage {
      position: relative;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background-color: #090E17;
    }

    #camFeed {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    #camFeed.mirrored {
      transform: scaleX(-1);
    }

    #hudOverlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    .top-bar {
      position: absolute;
      top: 12px;
      left: 14px;
      right: 14px;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      background: var(--panel-bg);
      border: 1px solid var(--border-subtle);
      padding: 9px 14px;
      border-radius: 8px;
    }

    .brand-title {
      font-size: 13px;
      font-weight: bold;
      color: var(--accent-cyan);
      letter-spacing: 0.6px;
    }

    .brand-title span {
      color: var(--accent-amber);
      font-size: 11px;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      font-size: 11px;
      font-weight: bold;
      padding: 4px 9px;
      border-radius: 4px;
      background: #162032;
      border: 1px solid #2A3A54;
      color: var(--accent-green);
    }

    .metrics-panel {
      position: absolute;
      right: 14px;
      top: 68px;
      width: 245px;
      z-index: 20;
      background: var(--panel-bg);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .panel-header {
      font-size: 10px;
      font-weight: bold;
      color: var(--accent-amber);
      letter-spacing: 1px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 5px;
      display: flex;
      justify-content: space-between;
    }

    .voice-dot {
      color: var(--accent-green);
    }

    .mood-readout {
      text-align: center;
      padding: 8px 6px;
      border-radius: 6px;
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .mood-main {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0.8px;
      color: var(--accent-green);
    }

    .mood-sub {
      font-size: 10px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .bar-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .bar-label {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--text-secondary);
    }

    .bar-track {
      width: 100%;
      height: 6px;
      background: #1E293B;
      border-radius: 3px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      transition: width 0.2s ease, background-color 0.2s ease;
    }

    .bottom-bar {
      position: absolute;
      bottom: 12px;
      left: 14px;
      right: 14px;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      background: var(--panel-bg);
      border: 1px solid var(--border-subtle);
      padding: 9px 14px;
      border-radius: 8px;
    }

    .verdict-box {
      font-size: 11px;
      font-weight: bold;
      color: var(--text-primary);
    }

    .verdict-box span {
      color: var(--accent-green);
    }

    .btn-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    button {
      background: #1E293B;
      border: 1px solid #334155;
      color: #F8FAFC;
      padding: 6px 10px;
      border-radius: 5px;
      font-size: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    button.primary {
      background: #0284C7;
      border-color: #38BDF8;
    }

    button.voice-active {
      background: #065F46;
      border-color: #10B981;
      color: #ECFDF5;
    }

    @media (max-width: 680px) {
      .metrics-panel {
        width: 190px;
        top: 62px;
        right: 10px;
        padding: 9px;
      }
      .mood-main { font-size: 13px; }
    }
  </style>
</head>
<body>

  <div id="appStage">
    <video id="camFeed" class="mirrored" autoplay playsinline muted></video>
    <canvas id="hudOverlay"></canvas>

    <div class="top-bar">
      <div class="brand-title">RAMMS GROUPS // AI MOOD ANALYZER <span>[BARITONE EDITION]</span></div>
      <div class="status-row">
        <span id="sysStatus" class="badge">STARTING...</span>
        <span id="fpsCounter" class="badge" style="color:#38BDF8;">0 FPS</span>
      </div>
    </div>

    <div class="metrics-panel">
      <div class="panel-header">
        <span>FACIAL TELEMETRY</span>
        <span id="voiceIndicator" class="voice-dot">🎙️ BARITONE ON</span>
      </div>

      <div class="mood-readout" id="moodCard">
        <div class="mood-main" id="moodTitle">LOADING AI...</div>
        <div class="mood-sub" id="moodDesc">Please wait 3 seconds</div>
      </div>

      <div class="bar-group">
        <div class="bar-label"><span>POSITIVITY / SMILE</span><span id="valHappy">0%</span></div>
        <div class="bar-track"><div class="bar-fill" id="barHappy" style="background:#10B981;"></div></div>
      </div>

      <div class="bar-group">
        <div class="bar-label"><span>COOL &amp; CALM</span><span id="valCalm">0%</span></div>
        <div class="bar-track"><div class="bar-fill" id="barCalm" style="background:#38BDF8;"></div></div>
      </div>

      <div class="bar-group">
        <div class="bar-label"><span>STRESS / TENSION</span><span id="valStress">0%</span></div>
        <div class="bar-track"><div class="bar-fill" id="barStress" style="background:#EF4444;"></div></div>
      </div>

      <div class="bar-group">
        <div class="bar-label"><span>SURPRISE / ALERT</span><span id="valSurprise">0%</span></div>
        <div class="bar-track"><div class="bar-fill" id="barSurprise" style="background:#F59E0B;"></div></div>
      </div>
    </div>

    <div class="bottom-bar">
      <div class="verdict-box">AI ASSESSMENT: <span id="verdictText">INITIALIZING NEURAL MESH...</span></div>
      <div class="btn-row">
        <button class="primary" onclick="startCamera()">START CAM</button>
        <button id="btnVoice" class="voice-active" onclick="toggleVoice()">VOICE: ON</button>
        <button onclick="speakCurrentReport(true)">SPEAK NOW</button>
        <button onclick="flipCamera()">SWITCH CAM</button>
      </div>
    </div>
  </div>

<script>
  const video = document.getElementById('camFeed');
  const canvas = document.getElementById('hudOverlay');
  const ctx = canvas.getContext('2d');

  const sysStatus = document.getElementById('sysStatus');
  const fpsCounter = document.getElementById('fpsCounter');
  const moodTitle = document.getElementById('moodTitle');
  const moodDesc = document.getElementById('moodDesc');
  const moodCard = document.getElementById('moodCard');
  const verdictText = document.getElementById('verdictText');
  const voiceIndicator = document.getElementById('voiceIndicator');

  const barHappy = document.getElementById('barHappy');
  const valHappy = document.getElementById('valHappy');
  const barCalm = document.getElementById('barCalm');
  const valCalm = document.getElementById('valCalm');
  const barStress = document.getElementById('barStress');
  const valStress = document.getElementById('valStress');
  const barSurprise = document.getElementById('barSurprise');
  const valSurprise = document.getElementById('valSurprise');

  let W = window.innerWidth;
  let H = window.innerHeight;
  let useFrontCam = true;

  let voiceEnabled = true;
  let currentMoodKey = 'NONE';
  let currentVoiceScript = 'Ladies and gentlemen, the biometric scanner is initializing. Please look towards the camera.';
  let lastSpokenMood = '';
  let lastSpokenTime = 0;
  let cachedVoices = [];

  function loadAvailableVoices() {
    if ('speechSynthesis' in window) {
      cachedVoices = window.speechSynthesis.getVoices();
    }
  }
  if ('speechSynthesis' in window) {
    loadAvailableVoices();
    window.speechSynthesis.onvoiceschanged = loadAvailableVoices;
  }

  function resizeCanvas() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function selectDeepMaleVoice() {
    if (!cachedVoices.length) loadAvailableVoices();
    const maleKeywords = ['male', 'david', 'daniel', 'ravi', 'prabhat', 'george', 'james', 'arthur', 'guy', 'uk english male', 'en-in'];
    let chosen = cachedVoices.find(v =>
      (v.lang.toLowerCase().includes('en-in') || v.lang.toLowerCase().includes('en-gb')) &&
      maleKeywords.some(k => v.name.toLowerCase().includes(k))
    );
    if (!chosen) {
      chosen = cachedVoices.find(v =>
        v.lang.toLowerCase().startsWith('en') &&
        maleKeywords.some(k => v.name.toLowerCase().includes(k))
      );
    }
    if (!chosen) {
      chosen = cachedVoices.find(v => v.lang.toLowerCase().startsWith('en'));
    }
    return chosen || null;
  }

  function speakCurrentReport(force = false) {
    if (!voiceEnabled && !force) return;
    if (!('speechSynthesis' in window)) return;

    const now = performance.now();
    if (!force) {
      if (window.speechSynthesis.speaking) return;
      if (currentMoodKey === lastSpokenMood && (now - lastSpokenTime) < 8000) return;
      if ((now - lastSpokenTime) < 3800) return;
    } else {
      window.speechSynthesis.cancel();
    }

    const utterance = new SpeechSynthesisUtterance(currentVoiceScript);
    const baritoneVoice = selectDeepMaleVoice();
    if (baritoneVoice) {
      utterance.voice = baritoneVoice;
      utterance.lang = baritoneVoice.lang;
    } else {
      utterance.lang = 'en-IN';
    }

    utterance.pitch = 0.62;
    utterance.rate = 0.86;
    utterance.volume = 1.0;

    utterance.onstart = () => {
      voiceIndicator.innerText = '🎙️ SPEAKING...';
      voiceIndicator.style.color = '#F59E0B';
    };
    utterance.onend = () => {
      voiceIndicator.innerText = voiceEnabled ? '🎙️ BARITONE ON' : '🔇 MUTED';
      voiceIndicator.style.color = voiceEnabled ? '#10B981' : '#94A3B8';
    };

    lastSpokenMood = currentMoodKey;
    lastSpokenTime = now;
    window.speechSynthesis.speak(utterance);
  }

  function toggleVoice() {
    voiceEnabled = !voiceEnabled;
    const btn = document.getElementById('btnVoice');
    if (voiceEnabled) {
      btn.innerText = 'VOICE: ON';
      btn.classList.add('voice-active');
      voiceIndicator.innerText = '🎙️ BARITONE ON';
      voiceIndicator.style.color = '#10B981';
      speakCurrentReport(true);
    } else {
      window.speechSynthesis.cancel();
      btn.innerText = 'VOICE: OFF';
      btn.classList.remove('voice-active');
      voiceIndicator.innerText = '🔇 MUTED';
      voiceIndicator.style.color = '#94A3B8';
    }
  }

  function flipCamera() {
    useFrontCam = !useFrontCam;
    if (useFrontCam) {
      video.classList.add('mirrored');
    } else {
      video.classList.remove('mirrored');
    }
    startCamera();
  }

  function dist2D(a, b) {
    return Math.hypot(a.x - b.x, a.y - b.y);
  }

  let sHappy = 0, sCalm = 50, sStress = 0, sSurprise = 0;

  function analyzeFacialMood(lm) {
    const faceWidth = dist2D(lm[234], lm[454]) || 0.1;

    const mouthWidth = dist2D(lm[61], lm[291]) / faceWidth;
    const mouthOpen = dist2D(lm[13], lm[14]) / faceWidth;
    const mouthCenterY = (lm[13].y + lm[14].y) * 0.5;
    const cornersAvgY = (lm[61].y + lm[291].y) * 0.5;
    const smileLift = (mouthCenterY - cornersAvgY) / faceWidth;

    const leftEyeOpen = dist2D(lm[159], lm[145]) / faceWidth;
    const rightEyeOpen = dist2D(lm[386], lm[374]) / faceWidth;
    const avgEyeOpen = (leftEyeOpen + rightEyeOpen) * 0.5;

    const innerBrowGap = dist2D(lm[107], lm[336]) / faceWidth;
    const browHeight = ((lm[159].y - lm[105].y) + (lm[386].y - lm[334].y)) * 0.5 / faceWidth;

    let rawHappy = Math.max(0, Math.min(100, ((smileLift + 0.015) * 1450) + ((mouthWidth - 0.36) * 280)));
    let rawSurprise = Math.max(0, Math.min(100, ((avgEyeOpen - 0.068) * 1800) + ((mouthOpen - 0.05) * 650)));
    let rawStress = Math.max(0, Math.min(100, ((0.22 - innerBrowGap) * 900) + ((0.095 - browHeight) * 1100) - rawHappy * 0.3));
    let rawSad = Math.max(0, Math.min(100, ((-smileLift - 0.012) * 1600) + ((0.058 - avgEyeOpen) * 900)));

    let rawCalm = Math.max(15, Math.min(100, 100 - (rawHappy * 0.45 + rawStress * 0.65 + rawSurprise * 0.65 + rawSad * 0.5)));

    sHappy += 0.25 * (rawHappy - sHappy);
    sCalm += 0.25 * (rawCalm - sCalm);
    sStress += 0.25 * (rawStress - sStress);
    sSurprise += 0.25 * (rawSurprise - sSurprise);

    const h = Math.round(sHappy);
    const c = Math.round(sCalm);
    const st = Math.round(sStress);
    const su = Math.round(sSurprise);

    barHappy.style.width = `${h}%`; valHappy.innerText = `${h}%`;
    barCalm.style.width = `${c}%`; valCalm.innerText = `${c}%`;
    barStress.style.width = `${st}%`; valStress.innerText = `${st}%`;
    barSurprise.style.width = `${su}%`; valSurprise.innerText = `${su}%`;

    let moodKey = 'CALM';
    let label = 'COOL & CALM';
    let desc = 'Everything looks normal & fine';
    let color = '#10B981';
    let verdict = 'SUBJECT IS COOL, CALM & EVERYTHING IS GOOD';
    let voiceLine = 'Ladies and gentlemen, behold. The subject is completely cool, calm, and composed. Everything is absolutely fine.';

    if (h >= 55 && h >= st && h >= su) {
      moodKey = 'HAPPY';
      label = 'HAPPY & POSITIVE';
      desc = 'Cheerful smile detected';
      color = '#10B981';
      verdict = 'SUBJECT IS HAPPY & IN A GREAT MOOD';
      voiceLine = 'What a wonderful sight! A radiant smile and pure positive energy. The person is in a magnificent mood!';
    } else if (su >= 58) {
      moodKey = 'SURPRISED';
      label = 'SURPRISED / ALERT';
      desc = 'High attention detected';
      color = '#F59E0B';
      verdict = 'SUBJECT APPEARS SURPRISED OR ALERT';
      voiceLine = 'Attention please! A sudden expression of surprise and heightened alertness has been detected.';
    } else if (st >= 52) {
      moodKey = 'STRESSED';
      label = 'TENSE / SERIOUS';
      desc = 'Elevated facial tension';
      color = '#EF4444';
      verdict = 'HIGH TENSION OR SERIOUS EXPRESSION';
      voiceLine = 'Observe carefully. The brow shows intense focus and seriousness. Take a deep breath and relax.';
    } else if (rawSad >= 52) {
      moodKey = 'TIRED';
      label = 'LOW ENERGY / TIRED';
      desc = 'Calm but low energy';
      color = '#A855F7';
      verdict = 'SUBJECT APPEARS TIRED OR LOW ENERGY';
      voiceLine = 'The expression appears calm, yet slightly low on energy. A moment of rest will restore full strength.';
    }

    currentMoodKey = moodKey;
    currentVoiceScript = voiceLine;

    moodTitle.innerText = label;
    moodTitle.style.color = color;
    moodDesc.innerText = desc;
    moodCard.style.borderColor = color;
    verdictText.innerText = verdict;
    verdictText.style.color = color;

    speakCurrentReport(false);

    return color;
  }

  function drawBiometricHUD(lm, accentColor) {
    let minX = 1, minY = 1, maxX = 0, maxY = 0;
    for (let i = 0; i < lm.length; i++) {
      const px = useFrontCam ? (1 - lm[i].x) : lm[i].x;
      const py = lm[i].y;
      if (px < minX) minX = px;
      if (px > maxX) maxX = px;
      if (py < minY) minY = py;
      if (py > maxY) maxY = py;
    }

    const x = minX * W - 16;
    const y = minY * H - 20;
    const w = (maxX - minX) * W + 32;
    const h = (maxY - minY) * H + 36;
    const corner = 18;

    ctx.strokeStyle = accentColor;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(x, y + corner); ctx.lineTo(x, y); ctx.lineTo(x + corner, y);
    ctx.moveTo(x + w - corner, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + corner);
    ctx.moveTo(x, y + h - corner); ctx.lineTo(x, y + h); ctx.lineTo(x + corner, y + h);
    ctx.moveTo(x + w - corner, y + h); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w, y + h - corner);
    ctx.stroke();

    ctx.fillStyle = accentColor;
    for (let i = 0; i < lm.length; i += 4) {
      const px = (useFrontCam ? (1 - lm[i].x) : lm[i].x) * W;
      const py = lm[i].y * H;
      ctx.fillRect(px - 1, py - 1, 2, 2);
    }
  }

  let frames = 0;
  let lastFpsStamp = performance.now();

  function onFaceResults(results) {
    frames++;
    const now = performance.now();
    if (now - lastFpsStamp >= 500) {
      fpsCounter.innerText = `${Math.round((frames * 1000) / (now - lastFpsStamp))} FPS`;
      frames = 0;
      lastFpsStamp = now;
    }

    ctx.clearRect(0, 0, W, H);

    const faces = results.multiFaceLandmarks || [];
    if (faces.length === 0) {
      sysStatus.innerText = 'SCANNING FOR FACE...';
      moodTitle.innerText = 'NO SUBJECT';
      moodTitle.style.color = '#94A3B8';
      moodDesc.innerText = 'Position face in camera';
      verdictText.innerText = 'NO PERSON DETECTED IN FRAME';
      verdictText.style.color = '#94A3B8';
      currentMoodKey = 'NONE';
      return;
    }

    sysStatus.innerText = `SUBJECT LOCKED (${faces.length})`;
    const primaryFace = faces[0];
    const moodColor = analyzeFacialMood(primaryFace);
    drawBiometricHUD(primaryFace, moodColor);
  }

  let faceMeshEngine = null;
  let loopStarted = false;
  let modelReady = false;

  async function initFaceMeshEngine() {
    if (faceMeshEngine) return;
    sysStatus.innerText = 'LOADING WASM AI...';

    if (typeof FaceMesh === 'undefined') {
      sysStatus.innerText = 'CDN SCRIPT ERROR';
      verdictText.innerText = 'AI SCRIPT FAILED TO LOAD - CHECK INTERNET';
      return;
    }

    faceMeshEngine = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/${file}`
    });

    faceMeshEngine.setOptions({
      maxNumFaces: 1,
      refineLandmarks: false,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    faceMeshEngine.onResults((results) => {
      modelReady = true;
      onFaceResults(results);
    });

    await faceMeshEngine.initialize();
    modelReady = true;
    sysStatus.innerText = 'AI ENGINE READY';
  }

  async function startCamera() {
    if ('speechSynthesis' in window) {
      const unlockUtterance = new SpeechSynthesisUtterance('Ladies and gentlemen, biometric baritone system online.');
      const v = selectDeepMaleVoice();
      if (v) unlockUtterance.voice = v;
      unlockUtterance.pitch = 0.62;
      unlockUtterance.rate = 0.86;
      window.speechSynthesis.speak(unlockUtterance);
    }

    sysStatus.innerText = 'OPENING CAMERA...';
    try {
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(t => t.stop());
      }

      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: useFrontCam ? 'user' : 'environment',
          width: { ideal: 640 },
          height: { ideal: 360 }
        },
        audio: false
      });

      video.srcObject = stream;
      await new Promise((resolve) => {
        video.onloadedmetadata = () => {
          video.width = video.videoWidth || 640;
          video.height = video.videoHeight || 360;
          resolve();
        };
      });
      await video.play();

      await initFaceMeshEngine();

      if (!loopStarted) {
        loopStarted = true;
        let busy = false;
        async function processLoop() {
          if (!busy && faceMeshEngine && video.readyState >= 2 && video.videoWidth > 0) {
            busy = true;
            try {
              await faceMeshEngine.send({ image: video });
            } catch (err) {
              sysStatus.innerText = 'FRAME RETRY...';
            }
            busy = false;
          }
          requestAnimationFrame(processLoop);
        }
        requestAnimationFrame(processLoop);
      }
    } catch (err) {
      sysStatus.innerText = 'ERROR: ' + (err.name || 'BLOCKED');
      verdictText.innerText = err.message || 'CAMERA OR AI INIT FAILED';
    }
  }

  window.addEventListener('load', startCamera);
</script>
</body>
</html>
