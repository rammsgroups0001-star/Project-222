<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RAMMS GROUPS // ZERO-LATENCY AI EXPRESSION ENGINE v4.0</title>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#070B12">

  <!-- Pinned Fast MediaPipe Face Mesh -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/face_mesh.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --bg-dark: #070B12;
      --panel-bg: rgba(11, 17, 29, 0.92);
      --border-subtle: rgba(56, 189, 248, 0.32);
      --accent-cyan: #38BDF8;
      --accent-green: #10B981;
      --accent-amber: #F59E0B;
      --accent-red: #EF4444;
      --accent-purple: #A855F7;
      --accent-indigo: #818CF8;
      --text-primary: #F1F5F9;
      --text-secondary: #94A3B8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Consolas, "Courier New", monospace;
      user-select: none;
    }

    body, html {
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: var(--text-primary);
    }

    #appStage {
      position: relative;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background-color: #090E17;
    }

    #camFeed {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    #camFeed.mirrored {
      transform: scaleX(-1);
    }

    #hudOverlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    .top-bar {
      position: absolute;
      top: 12px;
      left: 14px;
      right: 14px;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      background: var(--panel-bg);
      border: 1px solid var(--border-subtle);
      padding: 9px 14px;
      border-radius: 8px;
    }

    .brand-title {
      font-size: 13px;
      font-weight: bold;
      color: var(--accent-cyan);
      letter-spacing: 0.6px;
    }

    .brand-title span {
      color: var(--accent-green);
      font-size: 11px;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      font-size: 11px;
      font-weight: bold;
      padding: 4px 9px;
      border-radius: 4px;
      background: #162032;
      border: 1px solid #2A3A54;
      color: var(--accent-green);
    }

    .metrics-panel {
      position: absolute;
      right: 14px;
      top: 66px;
      width: 255px;
      z-index: 20;
      background: var(--panel-bg);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 11px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .panel-header {
      font-size: 10px;
      font-weight: bold;
      color: var(--accent-amber);
      letter-spacing: 1px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }

    .mood-readout {
      text-align: center;
      padding: 7px 6px;
      border-radius: 6px;
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.35);
    }

    .mood-main {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0.8px;
      color: var(--accent-green);
    }

    .mood-sub {
      font-size: 10px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .bar-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .bar-label {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--text-secondary);
    }

    .bar-track {
      width: 100%;
      height: 5px;
      background: #1E293B;
      border-radius: 3px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      transition: width 0.06s linear, background-color 0.1s ease;
    }

    .bottom-bar {
      position: absolute;
      bottom: 12px;
      left: 14px;
      right: 14px;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      background: var(--panel-bg);
      border: 1px solid var(--border-subtle);
      padding: 9px 14px;
      border-radius: 8px;
    }

    .verdict-box {
      font-size: 11px;
      font-weight: bold;
      color: var(--text-primary);
    }

    .verdict-box span {
      color: var(--accent-green);
    }

    .btn-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    button {
      background: #1E293B;
      border: 1px solid #334155;
      color: #F8FAFC;
      padding: 6px 10px;
      border-radius: 5px;
      font-size: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    button.primary {
      background: #0284C7;
      border-color: #38BDF8;
    }

    button.voice-active {
      background: #065F46;
      border-color: #10B981;
      color: #ECFDF5;
    }

    @media (max-width: 680px) {
      .metrics-panel {
        width: 195px;
        top: 60px;
        right: 10px;
        padding: 8px;
      }
      .mood-main { font-size: 13px; }
    }
  </style>
</head>
<body>

  <div id="appStage">
    <video id="camFeed" class="mirrored" autoplay playsinline muted></video>
    <canvas id="hudOverlay"></canvas>

    <div class="top-bar">
      <div class="brand-title">RAMMS GROUPS // ZERO-LATENCY AI <span>[v4.0 AUTO-CALIBRATED]</span></div>
      <div class="status-row">
        <span id="sysStatus" class="badge">STARTING...</span>
        <span id="fpsCounter" class="badge" style="color:#38BDF8;">0 FPS</span>
      </div>
    </div>

    <div class="metrics-panel">
      <div class="panel-header">
        <span>REAL-TIME DELTA</span>
        <span id="voiceIndicator" style="color:#10B981;">🔊 VOICE READY</span>
      </div>

      <div class="mood-readout" id="moodCard">
        <div class="mood-main" id="moodTitle">CALIBRATING...</div>
        <div class="mood-sub" id="moodDesc">Hold neutral face 1 sec</div>
      </div>

      <div class="bar-group">
        <div class="bar-label"><span>HAPPY / SMILING</span><span id="valHappy">0%</span></div>
        <div class="bar-track"><div class="bar-fill" id="barHappy" style="background:#10B981;"></div></div>
      </div>

      <div class="bar-group">
        <div class="bar-label"><span>SAD / UPSET</span><span id="valSad">0%</span></div>
        <div class="bar-track"><div class="bar-fill" id="barSad" style="background:#818CF8;"></div></div>
      </div>

      <div class="bar-group">
        <div class="bar-label"><span>SLEEPY / TIRED</span><span id="valSleepy">0%</span></div>
        <div class="bar-track"><div class="bar-fill" id="barSleepy" style="background:#A855F7;"></div></div>
      </div>

      <div class="bar-group">
        <div class="bar-label"><span>CONFUSED / THINKING</span><span id="valConfused">0%</span></div>
        <div class="bar-track"><div class="bar-fill" id="barConfused" style="background:#38BDF8;"></div></div>
      </div>

      <div class="bar-group">
        <div class="bar-label"><span>ANGRY / SERIOUS</span><span id="valStress">0%</span></div>
        <div class="bar-track"><div class="bar-fill" id="barStress" style="background:#EF4444;"></div></div>
      </div>

      <div class="bar-group">
        <div class="bar-label"><span>SURPRISED / SHOCKED</span><span id="valSurprise">0%</span></div>
        <div class="bar-track"><div class="bar-fill" id="barSurprise" style="background:#F59E0B;"></div></div>
      </div>
    </div>

    <div class="bottom-bar">
      <div class="verdict-box">LIVE STATUS: <span id="verdictText">WAITING FOR FACE...</span></div>
      <div class="btn-row">
        <button class="primary" onclick="resetBaseline()">RE-CALIBRATE</button>
        <button id="btnVoice" class="voice-active" onclick="toggleVoice()">VOICE: ON</button>
        <button onclick="cycleVoiceProfile()">CHANGE VOICE</button>
        <button onclick="flipCamera()">SWITCH CAM</button>
      </div>
    </div>
  </div>

<script>
  const video = document.getElementById('camFeed');
  const canvas = document.getElementById('hudOverlay');
  const ctx = canvas.getContext('2d');

  const sysStatus = document.getElementById('sysStatus');
  const fpsCounter = document.getElementById('fpsCounter');
  const moodTitle = document.getElementById('moodTitle');
  const moodDesc = document.getElementById('moodDesc');
  const moodCard = document.getElementById('moodCard');
  const verdictText = document.getElementById('verdictText');
  const voiceIndicator = document.getElementById('voiceIndicator');

  const barHappy = document.getElementById('barHappy'), valHappy = document.getElementById('valHappy');
  const barSad = document.getElementById('barSad'), valSad = document.getElementById('valSad');
  const barSleepy = document.getElementById('barSleepy'), valSleepy = document.getElementById('valSleepy');
  const barConfused = document.getElementById('barConfused'), valConfused = document.getElementById('valConfused');
  const barStress = document.getElementById('barStress'), valStress = document.getElementById('valStress');
  const barSurprise = document.getElementById('barSurprise'), valSurprise = document.getElementById('valSurprise');

  let W = window.innerWidth;
  let H = window.innerHeight;
  let useFrontCam = true;

  // Natural Real-Time Voice Engine (No Stuttering / No Cutting)
  let voiceEnabled = true;
  let currentMoodKey = 'NONE';
  let currentVoiceScript = 'Live scanner ready.';
  let lastSpokenMood = '';
  let lastSpokenTime = 0;
  let cachedVoices = [];
  let voiceIndex = 0;

  function loadAvailableVoices() {
    if ('speechSynthesis' in window) {
      const all = window.speechSynthesis.getVoices();
      const eng = all.filter(v => v.lang.toLowerCase().startsWith('en'));
      cachedVoices = eng.length ? eng : all;
    }
  }
  if ('speechSynthesis' in window) {
    loadAvailableVoices();
    window.speechSynthesis.onvoiceschanged = loadAvailableVoices;
  }

  function cycleVoiceProfile() {
    if (!cachedVoices.length) loadAvailableVoices();
    if (!cachedVoices.length) return;
    voiceIndex = (voiceIndex + 1) % cachedVoices.length;
    const v = cachedVoices[voiceIndex];
    voiceIndicator.innerText = `🔊 V${voiceIndex + 1}: ${v.name.slice(0, 12)}`;
    speakCurrentReport(true);
  }

  function speakCurrentReport(force = false) {
    if (!voiceEnabled && !force) return;
    if (!('speechSynthesis' in window)) return;

    const now = performance.now();
    const moodChanged = currentMoodKey !== lastSpokenMood && currentMoodKey !== 'NONE';

    if (!force) {
      // Never cut a sentence mid-word; wait for natural completion unless 4.5s passed
      if (window.speechSynthesis.speaking) return;
      if (!moodChanged && (now - lastSpokenTime) < 6500) return;
      if (moodChanged && (now - lastSpokenTime) < 1600) return;
    } else {
      window.speechSynthesis.cancel();
    }

    const utterance = new SpeechSynthesisUtterance(currentVoiceScript);
    if (cachedVoices.length) {
      utterance.voice = cachedVoices[voiceIndex % cachedVoices.length];
      utterance.lang = utterance.voice.lang;
    } else {
      utterance.lang = 'en-US';
    }

    utterance.pitch = 1.0;
    utterance.rate = 1.08;
    utterance.volume = 1.0;

    utterance.onstart = () => {
      voiceIndicator.innerText = '🔊 SPEAKING...';
      voiceIndicator.style.color = '#38BDF8';
    };
    utterance.onend = () => {
      voiceIndicator.innerText = voiceEnabled ? '🔊 VOICE ON' : '🔇 MUTED';
      voiceIndicator.style.color = voiceEnabled ? '#10B981' : '#94A3B8';
    };

    lastSpokenMood = currentMoodKey;
    lastSpokenTime = now;
    window.speechSynthesis.speak(utterance);
  }

  function toggleVoice() {
    voiceEnabled = !voiceEnabled;
    const btn = document.getElementById('btnVoice');
    if (voiceEnabled) {
      btn.innerText = 'VOICE: ON';
      btn.classList.add('voice-active');
      voiceIndicator.innerText = '🔊 VOICE ON';
      voiceIndicator.style.color = '#10B981';
      speakCurrentReport(true);
    } else {
      window.speechSynthesis.cancel();
      btn.innerText = 'VOICE: OFF';
      btn.classList.remove('voice-active');
      voiceIndicator.innerText = '🔇 MUTED';
      voiceIndicator.style.color = '#94A3B8';
    }
  }

  function flipCamera() {
    useFrontCam = !useFrontCam;
    if (useFrontCam) {
      video.classList.add('mirrored');
    } else {
      video.classList.remove('mirrored');
    }
    resetBaseline();
    startCamera();
  }

  function resizeCanvas() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function dist2D(a, b) {
    return Math.hypot(a.x - b.x, a.y - b.y);
  }

  // --- AUTO-CALIBRATION BASELINE (Eliminates "Stuck on Surprised/Happy" Forever) ---
  let baseline = null;
  let calibFrames = 0;
  let sumEAR = 0, sumCornerDelta = 0, sumMouthWidth = 0, sumMouthOpen = 0, sumBrowGap = 0, sumBrowLift = 0;

  function resetBaseline() {
    baseline = null;
    calibFrames = 0;
    sumEAR = sumCornerDelta = sumMouthWidth = sumMouthOpen = sumBrowGap = sumBrowLift = 0;
    moodTitle.innerText = 'CALIBRATING...';
    moodDesc.innerText = 'Hold normal face 1 sec';
  }

  // Instant zero-lag display values (alpha = 0.72 for immediate millisecond reaction)
  let sHappy = 0, sSad = 0, sSleepy = 0, sConfused = 0, sStress = 0, sSurprise = 0;

  function analyzeFacialMood(lm) {
    const eyeSpan = dist2D(lm[33], lm[263]) || 0.1;

    // Raw Normalized Metrics
    const mouthWidth = dist2D(lm[61], lm[291]) / eyeSpan;
    const mouthOpen = dist2D(lm[13], lm[14]) / eyeSpan;
    const lipCenterY = (lm[13].y + lm[14].y) * 0.5;
    const cornersAvgY = (lm[61].y + lm[291].y) * 0.5;
    const cornerDelta = (lipCenterY - cornersAvgY) / eyeSpan;

    const leftEAR = dist2D(lm[159], lm[145]) / (dist2D(lm[33], lm[133]) || 0.05);
    const rightEAR = dist2D(lm[386], lm[374]) / (dist2D(lm[362], lm[263]) || 0.05);
    const avgEAR = (leftEAR + rightEAR) * 0.5;

    const innerBrowGap = dist2D(lm[107], lm[336]) / eyeSpan;
    const leftBrowLift = (lm[159].y - lm[105].y) / eyeSpan;
    const rightBrowLift = (lm[386].y - lm[334].y) / eyeSpan;
    const avgBrowLift = (leftBrowLift + rightBrowLift) * 0.5;
    const browAsymmetry = Math.abs(leftBrowLift - rightBrowLift);
    const headTilt = Math.abs(lm[33].y - lm[263].y) / eyeSpan;

    // Step 1: Capture user's personal neutral baseline in first 12 frames (~0.6 sec)
    if (!baseline) {
      calibFrames++;
      sumEAR += avgEAR;
      sumCornerDelta += cornerDelta;
      sumMouthWidth += mouthWidth;
      sumMouthOpen += mouthOpen;
      sumBrowGap += innerBrowGap;
      sumBrowLift += avgBrowLift;

      moodTitle.innerText = 'CALIBRATING...';
      moodTitle.style.color = '#38BDF8';
      moodDesc.innerText = `Locking neutral face (${Math.round((calibFrames / 12) * 100)}%)`;

      if (calibFrames >= 12) {
        baseline = {
          ear: sumEAR / calibFrames,
          cornerDelta: sumCornerDelta / calibFrames,
          mouthWidth: sumMouthWidth / calibFrames,
          mouthOpen: sumMouthOpen / calibFrames,
          browGap: sumBrowGap / calibFrames,
          browLift: sumBrowLift / calibFrames
        };
      }
      return '#38BDF8';
    }

    // Step 2: Compute pure REAL-TIME DELTA from user's own neutral face!
    const dCorner = cornerDelta - baseline.cornerDelta;       // + = smile, - = sad
    const dMouthW = mouthWidth - baseline.mouthWidth;         // + = wide smile
    const dMouthOpen = mouthOpen - baseline.mouthOpen;        // + = open mouth
    const dEAR = avgEAR - baseline.ear;                       // + = wide eyes, - = sleepy/closed
    const dBrowGap = baseline.browGap - innerBrowGap;         // + = brows squeezed together
    const dBrowLift = baseline.browLift - avgBrowLift;        // + = brows pushed down

    // Pure delta scoring (0 when neutral, spikes immediately when expression changes)
    let rawHappy = Math.max(0, (dCorner * 2200) + (dMouthW * 950));
    let rawSad = Math.max(0, (-dCorner * 2600) + Math.max(0, -dEAR * 400));
    let rawSleepy = Math.max(0, (-dEAR * 1950)) + (dMouthOpen > 0.25 && dEAR < -0.02 ? 45 : 0);
    let rawConfused = Math.max(0, (headTilt - 0.11) * 750) + Math.max(0, (browAsymmetry - 0.03) * 1900);
    let rawStress = Math.max(0, (dBrowGap * 2400) + (dBrowLift * 2200)) - (rawHappy * 0.4);
    // Surprise ONLY triggers when BOTH eyes open wider than baseline AND mouth opens significantly
    let rawSurprise = (dEAR > 0.035 && dMouthOpen > 0.12)
      ? ((dEAR - 0.03) * 1600) + ((dMouthOpen - 0.10) * 650)
      : Math.max(0, (dMouthOpen - 0.22) * 550);

    rawHappy = Math.min(100, rawHappy);
    rawSad = Math.min(100, rawSad);
    rawSleepy = Math.min(100, rawSleepy);
    rawConfused = Math.min(100, rawConfused);
    rawStress = Math.min(100, rawStress);
    rawSurprise = Math.min(100, rawSurprise);

    // Ultra-fast response (alpha = 0.72)
    const alpha = 0.72;
    sHappy += alpha * (rawHappy - sHappy);
    sSad += alpha * (rawSad - sSad);
    sSleepy += alpha * (rawSleepy - sSleepy);
    sConfused += alpha * (rawConfused - sConfused);
    sStress += alpha * (rawStress - sStress);
    sSurprise += alpha * (rawSurprise - sSurprise);

    const h = Math.round(sHappy);
    const sa = Math.round(sSad);
    const sl = Math.round(sSleepy);
    const co = Math.round(sConfused);
    const st = Math.round(sStress);
    const su = Math.round(sSurprise);

    barHappy.style.width = `${h}%`; valHappy.innerText = `${h}%`;
    barSad.style.width = `${sa}%`; valSad.innerText = `${sa}%`;
    barSleepy.style.width = `${sl}%`; valSleepy.innerText = `${sl}%`;
    barConfused.style.width = `${co}%`; valConfused.innerText = `${co}%`;
    barStress.style.width = `${st}%`; valStress.innerText = `${st}%`;
    barSurprise.style.width = `${su}%`; valSurprise.innerText = `${su}%`;

    const emotions = [
      { key: 'HAPPY', val: h, label: 'HAPPY & SMILING', desc: 'Smile detected', color: '#10B981', verdict: 'HAPPY & SMILING', voice: 'You look very happy and smiling right now.' },
      { key: 'SAD', val: sa, label: 'SAD / UPSET', desc: 'Sad expression detected', color: '#818CF8', verdict: 'SAD OR UPSET', voice: 'You look sad or a little upset right now.' },
      { key: 'SLEEPY', val: sl, label: 'SLEEPY / TIRED', desc: 'Eyelids drooping', color: '#A855F7', verdict: 'SLEEPY OR TIRED', voice: 'You look sleepy and tired right now.' },
      { key: 'CONFUSED', val: co, label: 'CONFUSED / THINKING', desc: 'Thinking posture detected', color: '#38BDF8', verdict: 'CONFUSED OR THINKING', voice: 'You look confused or deep in thought.' },
      { key: 'STRESSED', val: st, label: 'ANGRY / SERIOUS', desc: 'Brow tension detected', color: '#EF4444', verdict: 'SERIOUS OR STRESSED', voice: 'You look serious or stressed right now.' },
      { key: 'SURPRISED', val: su, label: 'SURPRISED / SHOCKED', desc: 'Sudden surprise detected', color: '#F59E0B', verdict: 'SURPRISED OR SHOCKED', voice: 'Whoa, you look completely surprised!' }
    ];

    emotions.sort((a, b) => b.val - a.val);
    const top = emotions[0];

    let moodKey = 'CALM';
    let label = 'COOL & CALM';
    let desc = 'Neutral & relaxed (0% drift)';
    let color = '#10B981';
    let verdict = 'COOL, CALM & RELAXED';
    let voiceLine = 'Everything looks cool, calm, and normal.';

    if (top.val >= 38) {
      moodKey = top.key;
      label = top.label;
      desc = `${top.desc} (${top.val}%)`;
      color = top.color;
      verdict = `${top.verdict} (${top.val}%)`;
      voiceLine = top.voice;
    }

    currentMoodKey = moodKey;
    currentVoiceScript = voiceLine;

    moodTitle.innerText = label;
    moodTitle.style.color = color;
    moodDesc.innerText = desc;
    moodCard.style.borderColor = color;
    verdictText.innerText = verdict;
    verdictText.style.color = color;

    speakCurrentReport(false);

    return color;
  }

  function drawBiometricHUD(lm, accentColor) {
    let minX = 1, minY = 1, maxX = 0, maxY = 0;
    for (let i = 0; i < lm.length; i++) {
      const px = useFrontCam ? (1 - lm[i].x) : lm[i].x;
      const py = lm[i].y;
      if (px < minX) minX = px;
      if (px > maxX) maxX = px;
      if (py < minY) minY = py;
      if (py > maxY) maxY = py;
    }

    const x = minX * W - 16;
    const y = minY * H - 20;
    const w = (maxX - minX) * W + 32;
    const h = (maxY - minY) * H + 36;
    const corner = 18;

    ctx.strokeStyle = accentColor;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(x, y + corner); ctx.lineTo(x, y); ctx.lineTo(x + corner, y);
    ctx.moveTo(x + w - corner, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + corner);
    ctx.moveTo(x, y + h - corner); ctx.lineTo(x, y + h); ctx.lineTo(x + corner, y + h);
    ctx.moveTo(x + w - corner, y + h); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w, y + h - corner);
    ctx.stroke();

    ctx.fillStyle = accentColor;
    for (let i = 0; i < lm.length; i += 4) {
      const px = (useFrontCam ? (1 - lm[i].x) : lm[i].x) * W;
      const py = lm[i].y * H;
      ctx.fillRect(px - 1, py - 1, 2, 2);
    }
  }

  let frames = 0;
  let lastFpsStamp = performance.now();

  function onFaceResults(results) {
    frames++;
    const now = performance.now();
    if (now - lastFpsStamp >= 500) {
      fpsCounter.innerText = `${Math.round((frames * 1000) / (now - lastFpsStamp))} FPS`;
      frames = 0;
      lastFpsStamp = now;
    }

    ctx.clearRect(0, 0, W, H);

    const faces = results.multiFaceLandmarks || [];
    if (faces.length === 0) {
      sysStatus.innerText = 'SCANNING FOR FACE...';
      moodTitle.innerText = 'NO SUBJECT';
      moodTitle.style.color = '#94A3B8';
      moodDesc.innerText = 'Align face in frame';
      verdictText.innerText = 'NO FACE IN FRAME';
      verdictText.style.color = '#94A3B8';
      currentMoodKey = 'NONE';
      baseline = null;
      calibFrames = 0;
      sumEAR = sumCornerDelta = sumMouthWidth = sumMouthOpen = sumBrowGap = sumBrowLift = 0;
      return;
    }

    sysStatus.innerText = `LIVE TRACKING (${faces.length})`;
    const primaryFace = faces[0];
    const moodColor = analyzeFacialMood(primaryFace);
    drawBiometricHUD(primaryFace, moodColor);
  }

  let faceMeshEngine = null;
  let loopStarted = false;

  async function initFaceMeshEngine() {
    if (faceMeshEngine) return;
    sysStatus.innerText = 'LOADING WASM AI...';

    faceMeshEngine = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/${file}`
    });

    faceMeshEngine.setOptions({
      maxNumFaces: 1,
      refineLandmarks: false,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    faceMeshEngine.onResults(onFaceResults);
    await faceMeshEngine.initialize();
    sysStatus.innerText = 'AI ENGINE READY';
  }

  async function startCamera() {
    if ('speechSynthesis' in window) {
      const unlockUtterance = new SpeechSynthesisUtterance('Biometric scanner online.');
      if (cachedVoices.length) unlockUtterance.voice = cachedVoices[voiceIndex % cachedVoices.length];
      window.speechSynthesis.speak(unlockUtterance);
    }

    sysStatus.innerText = 'OPENING CAMERA...';
    try {
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(t => t.stop());
      }

      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: useFrontCam ? 'user' : 'environment',
          width: { ideal: 640 },
          height: { ideal: 360 }
        },
        audio: false
      });

      video.srcObject = stream;
      await new Promise((resolve) => {
        video.onloadedmetadata = () => {
          video.width = video.videoWidth || 640;
          video.height = video.videoHeight || 360;
          resolve();
        };
      });
      await video.play();

      await initFaceMeshEngine();

      if (!loopStarted) {
        loopStarted = true;
        let busy = false;
        async function processLoop() {
          if (!busy && faceMeshEngine && video.readyState >= 2 && video.videoWidth > 0) {
            busy = true;
            try {
              await faceMeshEngine.send({ image: video });
            } catch (err) {}
            busy = false;
          }
          requestAnimationFrame(processLoop);
        }
        requestAnimationFrame(processLoop);
      }
    } catch (err) {
      sysStatus.innerText = 'ERROR: ' + (err.name || 'BLOCKED');
      verdictText.innerText = err.message || 'CAMERA OR AI INIT FAILED';
    }
  }

  window.addEventListener('load', startCamera);
</script>
</body>
</html>
